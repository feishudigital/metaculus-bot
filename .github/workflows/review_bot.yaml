name: Review recent forecasts

on:
  workflow_dispatch:
    inputs:
      days:
        description: "How many days back to look for resolved questions"
        default: "30"
      dump_posts:
        description: "Optional post IDs (space-separated): save the research, forecasts and summary sections of their bot comments for offline reading"
        default: ""
  schedule:
    - cron: "0 6 * * 1" # weekly, Monday morning

# Add concurrency group to prevent parallel runs
concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

# Scores how the bot's resolved forecasts turned out. Read-only: it makes no
# forecasts, spends nothing on LLMs, and publishes nothing.
# The weekly run is off by default: set the repository variable REVIEW_BOT_ENABLED to
# true to turn it on. Running it by hand always works.
jobs:
  review_job:
    if: vars.REVIEW_BOT_ENABLED == 'true' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install uv
        uses: astral-sh/setup-uv@v10.3.0
        with:
          version: "0.13.1"
      - name: Install dependencies
        run: uv sync --locked --group integrations
      - name: Review forecasts
        run: |
          uv run bot-review review \
            --resolved-since ${{ inputs.days || 30 }} \
            --output review.json \
            --summary review.md
        env:
          METACULUS_TOKEN: ${{ secrets.METACULUS_TOKEN }}
      - name: Save report sections of selected posts
        if: inputs.dump_posts != ''
        env:
          METACULUS_TOKEN: ${{ secrets.METACULUS_TOKEN }}
          DUMP_POSTS: ${{ inputs.dump_posts }}
        run: |
          mkdir -p sections
          for post in $DUMP_POSTS; do
            case "$post" in *[!0-9]*) echo "skipping non-numeric post id"; continue ;; esac
            for section in summary research forecasts; do
              uv run bot-review show "$post" --section "$section" --seconds-between-requests 3 \
                > "sections/${post}_${section}.txt" 2>/dev/null || echo "show $post $section failed"
            done
          done
      - name: Show the summary in the run page
        run: cat review.md >> $GITHUB_STEP_SUMMARY
      - name: Keep the review
        uses: actions/upload-artifact@v4
        with:
          name: review
          path: |
            review.json
            review.md
            sections/
          if-no-files-found: ignore
          retention-days: 90
