name: Forecast on new AI tournament questions

on:
  workflow_dispatch:
  schedule:
    - cron: "2-59/5 * * * *" # every 5 min (GitHub drops many scheduled runs), off the hour. Already-forecasted questions are skipped.

# Add concurrency group to prevent parallel runs
# Shared across bot workflows so cost-ledger commits never race.
concurrency:
  group: bot-cost-ledger
  cancel-in-progress: false

permissions:
  contents: read


# Daily job to run the simple forecast bot
jobs:
  forecast_job:
    runs-on: ubuntu-latest # determines the machine that will run the job - keep as is
    steps: # sets up the steps that will be run in order
      # setup repository with all necessary dependencies - keep as is
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          # Tip, not the triggering commit: a queued run must see the newest ledger.
          ref: main
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install uv
        uses: astral-sh/setup-uv@v10.3.0
        with:
          version: "0.13.1"
      - name: Install dependencies
        run: uv sync --locked
      - name: Run bot
        run: |
          uv run python main.py
        # this reads the environment variables from the github repository.
        # Store under Settings --> Secrets and variables --> Actions
        env:
          BOT_MONTHLY_BUDGET_USD: ${{ vars.BOT_MONTHLY_BUDGET_USD }}
          BOT_BUDGET_MONTH_OVERRIDE: ${{ vars.BOT_BUDGET_MONTH_OVERRIDE }}
          METACULUS_TOKEN: ${{ secrets.METACULUS_TOKEN }} # replace this with the name of the variable under which you stored your own Metaculus token
          PERPLEXITY_API_KEY: ${{ secrets.PERPLEXITY_API_KEY }}
          EXA_API_KEY: ${{ secrets.EXA_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          ASKNEWS_CLIENT_ID: ${{ secrets.ASKNEWS_CLIENT_ID }}
          ASKNEWS_SECRET: ${{ secrets.ASKNEWS_SECRET }}

      - name: Hand cost ledger to the commit job
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: run-cost
          path: run_cost.json
          if-no-files-found: ignore

  # Only this job can write to the repo; the bot job above runs third-party
  # packages and keeps a read-only token.
  save_ledger:
    needs: forecast_job
    if: always()
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Check out default branch
        uses: actions/checkout@v4
        with:
          ref: main
      - name: Fetch this run's cost
        uses: actions/download-artifact@v4
        with:
          name: run-cost
          path: ${{ runner.temp }}
        continue-on-error: true
      - name: Add run cost to the ledger at the branch tip
        env:
          RUN_COST: ${{ runner.temp }}/run_cost.json
          BRANCH: main
        run: |
          [ -f "$RUN_COST" ] || exit 0
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for attempt in 1 2 3; do
            git fetch origin "$BRANCH"
            git reset --hard "origin/$BRANCH"
            python3 budget.py merge-run-cost "$RUN_COST"
            git add kosten.json
            git commit -m "Update cost ledger"
            git push origin "HEAD:$BRANCH" && exit 0
          done
          exit 1
