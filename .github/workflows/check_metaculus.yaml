name: Check Metaculus

# Free health check without LLM calls: token account, question counts per status.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Query Metaculus
        run: python3 check_metaculus.py
        env:
          METACULUS_TOKEN: ${{ secrets.METACULUS_TOKEN }}
